<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RockArg — iniciar sesión</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
</head>
<body>

<header class="topbar">
  <a href="index.html" class="brand">
    <img src="imagenes/logos/isotipo_2.png" alt="Isotipo de RockArg: auriculares con la bandera argentina">
    <span>RockArg</span>
  </a>
  <nav class="nav-links">
    <a href="index.html">Inicio</a>
    <a href="explorar.html">Explorar</a>
    <a href="historia.html">Historia</a>
  </nav>
  <div class="nav-actions">
    <a href="registro.html"><button class="btn btn-primary">Registrarse</button></a>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Iniciar sesión</h1>
    <p class="lead">Entrá a tu cuenta para guardar tus canciones y seguir escuchando.</p>


<form id="formLogin" class="auth-form">
  <div class="field">
    <label for="mailLogin">Correo electrónico</label>
    <input type="email" id="mailLogin" name="mail" placeholder="Ingresá tu mail" autocomplete="email" required>
  </div>

  <div class="field">
    <label for="contrasenaLogin">Contraseña</label>
    <input type="password" id="contrasenaLogin" name="contraseña" placeholder="Ingresá tu contraseña" autocomplete="current-password" required>
  </div>

  <button type="submit">Iniciar sesión</button>
  <p id="mensajeLogin" class="mensaje-auth" aria-live="polite"></p>
  <p>¿Todavía no tenés una cuenta? <a href="/registro.html">Registrate</a></p>
</form>

    <p class="auth-switch">¿No tenés cuenta todavía? <a href="registro.html">Registrate</a></p>
    <a href="index.html" class="auth-back">← Volver al inicio</a>
  </div>
</div>

<footer>
  <a href="index.html" class="brand"><img src="isotipo.png" alt="RockArg"><span style="font-size:15px;">RockArg</span></a>
  <div class="foot-links">
    <a href="explorar.html">Explorar</a>
    <a href="historia.html">Historia</a>
    <a href="registro.html">Registrarse</a>
  </div>
</footer>

<script src="auth.js"></script>

</body>
</html>
