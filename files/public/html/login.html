<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RockArg — iniciar sesión</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
</head>
<body class="auth-page">
<header class="topbar">
  <a href="/html/index.html" class="brand">
    <img src="/imagenes/logos/isotipo_2.png" alt="RockArg">
    <span>RockArg</span>
  </a>
  <nav class="nav-links">
    <a href="/html/index.html">Inicio</a>
    <a href="/html/explorar.html">Explorar</a>
    <a href="/html/historia.html">Historia</a>
  </nav>
  <div class="nav-actions">
    <a href="/html/registro.html" class="btn btn-primary">Registrarse</a>
  </div>
</header>

<main class="auth-wrap">
  <section class="auth-card" aria-labelledby="authTitle">
    <p class="eyebrow">Tu espacio en RockArg</p>
    <h1 id="authTitle">Iniciar sesión</h1>
    <p class="lead">Entrá a tu cuenta de RockArg.</p>

    <form id="formLogin" class="auth-form">
      <div class="field">
        <label for="usuarioLogin">Nombre de usuario</label>
        <input type="text" id="usuarioLogin" name="usuario" placeholder="Ingresá tu usuario" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="contrasenaLogin">Contraseña</label>
        <input type="password" id="contrasenaLogin" name="contraseña" placeholder="Ingresá tu contraseña" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn btn-primary auth-submit">Iniciar sesión</button>
      <p id="mensajeLogin" class="mensaje-auth" aria-live="polite"></p>
    </form>

    <div class="auth-navigation">
      <p>¿Todavía no tenés una cuenta?</p>
      <a href="/html/registro.html" class="btn auth-secondary">Crear una cuenta</a>
      <a href="/html/index.html" class="btn auth-back"><span aria-hidden="true">←</span> Volver al inicio</a>
    </div>
  </section>
</main>

<footer>
  <a href="/html/index.html" class="brand">
    <img src="/imagenes/logos/isotipo_2.png" alt="RockArg">
    <span style="font-size:15px;">RockArg</span>
  </a>
  <div class="foot-links">
    <a href="/html/explorar.html">Explorar</a>
    <a href="/html/historia.html">Historia</a>
    <a href="/html/registro.html">Registrarse</a>
  </div>
</footer>

<script type="module" src="/js/usuario.js"></script>
</body>
</html>
