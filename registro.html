<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RockArg — registrarse</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
</head>
<body>

<header class="topbar">
  <a href="index.html" class="brand">
    <img src="imagenes/logos/isotipo_2.png" alt="Isotipo de RockArg: auriculares con la bandera argentina">
    <span>RockArg</span>
  </a>
  <nav class="nav-links">
    <a href="index.html">Inicio</a>
    <a href="explorar.html">Explorar</a>
    <a href="historia.html">Historia</a>
  </nav>
  <div class="nav-actions">
    <a href="login.html"><button class="btn">Iniciar sesión</button></a>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Creá tu cuenta</h1>
    <p class="lead">Sumate a RockArg y armá tu propia biblioteca de rock nacional.</p>

   

<form id="formRegistro" class="auth-form">
  <div class="field">
    <label for="mailRegistro">Correo electrónico</label>
    <input type="email" id="mailRegistro" name="mail" placeholder="Ingresá tu mail" autocomplete="email" required>
  </div>

  <div class="field">
    <label for="contrasenaRegistro">Contraseña</label>
    <input type="password" id="contrasenaRegistro" name="contraseña" placeholder="Mínimo 8 caracteres" minlength="8" maxlength="128" autocomplete="new-password" required>
  </div>

  <button type="submit">Registrarse</button>
  <p id="mensajeRegistro" class="mensaje-auth" aria-live="polite"></p>
  <p>¿Ya tenés una cuenta? <a href="/login.html">Iniciá sesión</a></p>
</form>


    <p class="auth-switch">¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a></p>
    <a href="index.html" class="auth-back">← Volver al inicio</a>
  </div>
</div>

<footer>
  <a href="index.html" class="brand"><img src="isotipo.png" alt="RockArg"><span style="font-size:15px;">RockArg</span></a>
  <div class="foot-links">
    <a href="explorar.html">Explorar</a>
    <a href="historia.html">Historia</a>
    <a href="login.html">Iniciar sesión</a>
  </div>
</footer>

<script src="auth.js"></script>

</body>
</html>
